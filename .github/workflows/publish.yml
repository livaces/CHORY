name: Publish Logseq
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: logseq/publish-spa@v0.3.0
      - name: Add nojekyll
        run: touch $GITHUB_WORKSPACE/www/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www
          branch: gh-pages

